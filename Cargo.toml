[package]
name = "lfc"
version = "0.1.0"
edition = "2021"

[dependencies]
bip39 = { version = "2.1.0", features = ["rand"] }
clap = { version = "4.5.28", features = ["derive"] }
dirs = "6.0.0"
hex-conservative = { version = "0.3.0", features = ["serde"] }
lazy_static = "1.5.0"
miniscript = {version = "12.3.0", features = ["serde", "rand", "compiler", "base64"]}
num_enum = "0.7.5"
serde = { version = "1.0.217", features =  ["derive"] }
serde_json = "1.0.138"
thiserror = "2.0.17"

[dev-dependencies]
os_pipe = "1.2.3"
temp-dir = "0.1.16"
corepc-node = { git = "https://github.com/rust-bitcoin/corepc.git", features = ["download", "30_0"]}
